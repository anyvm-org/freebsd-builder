VM_VHD_LINK="https://archive.freebsd.org/old-releases/VM-IMAGES/10.4-RELEASE/amd64/Latest/FreeBSD-10.4-RELEASE-amd64.qcow2.xz"
VM_OS_NAME="freebsd"
VM_SSH_PORT=2222
VM_RELEASE=10.4

# FreeBSD 10.4 can panic in signal delivery when KVM exposes the full modern
# host CPU/XSAVE feature set. Use QEMU's conservative x86-64 model for this
# historical guest; newer FreeBSD releases continue to use -cpu host.
VM_CPU_MODEL="qemu64"

# FreeBSD 10.4 uses the historical "Amnesiac" login banner.
# Match the stable architecture prefix instead of the hostname.
VM_LOGIN_TAG="FreeBSD/amd64 ("

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"

# The official FreeBSD 10 package repository is gone. Bootstrap pkg and use
# the preserved mirror of the signed FreeBSD package repository instead.
VM_INSTALL_CMD="pkg install -y "
VM_INSTALL_SCRIPT="conf/freebsd-legacy-pkg.sh"
VM_PKG_PATH="https://mirror.sg.gs/freebsd-pkg/FreeBSD:10:amd64/latest"

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fusefs-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"

VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
