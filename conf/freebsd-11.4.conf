VM_VHD_LINK="https://archive.freebsd.org/old-releases/VM-IMAGES/11.4-RELEASE/amd64/Latest/FreeBSD-11.4-RELEASE-amd64.qcow2.xz"
VM_OS_NAME="freebsd"
VM_SSH_PORT=2222
VM_RELEASE=11.4

VM_LOGIN_TAG="64 (freebsd) (tty"

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"

# The official FreeBSD 11 package repository is gone. Bootstrap pkg and use
# the preserved mirror of the signed FreeBSD package repository instead.
VM_INSTALL_CMD="pkg install -y "
VM_INSTALL_SCRIPT="conf/freebsd-legacy-pkg.sh"
VM_PKG_PATH="https://mirror.sg.gs/freebsd-pkg/FreeBSD:11:amd64/latest"

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fusefs-sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"

VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
